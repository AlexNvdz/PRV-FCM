<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Analítica prescriptiva PRV-FCM para rendimiento académico y deserción escolar." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Pizarra PRV-FCM</title>
    <script>
      // Tema antes de pintar, para evitar un destello claro en modo oscuro.
      try {
        const guardado = localStorage.getItem('pizarra.tema');
        const oscuro = guardado ? guardado === 'oscuro' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.tema = oscuro ? 'oscuro' : 'claro';
      } catch {
        document.documentElement.dataset.tema = 'claro';
      }
    </script>
  </head>
  <body>
    <div id="raiz"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
